name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - name: Check format
        run: npm run fmt:check
      - name: Typecheck
        run: npm run tsc
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test run
      - name: Build
        run: npm run build
