name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm install
      - name: Check format
        run: npm run fmt:check
      - name: Typecheck
        run: npm run tsc
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test run
      - name: Build
        run: npm run build
